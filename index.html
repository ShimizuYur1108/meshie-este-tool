<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meshie SNS管理ツール（エステ版）</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F7F4F8; font-family: 'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif; }
    textarea:focus { outline: none; }
    button { font-family: inherit; }
    a { font-family: inherit; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const TYPES = [
  { id: "campaign", emoji: "🎁", label: "キャンペーン", sub: "割引・期間限定" },
  { id: "skin",     emoji: "✨", label: "肌質改善",     sub: "フェイシャル・美肌" },
  { id: "removal",  emoji: "💎", label: "脱毛",         sub: "全身・部位別" },
  { id: "info",     emoji: "📢", label: "お知らせ",     sub: "一般情報" },
];

const STYLES = [
  { id: "pop",      label: "ポップ",     emoji: "🎉", desc: "明るくフレンドリー・絵文字多め" },
  { id: "elegant",  label: "上品",       emoji: "✦",  desc: "落ち着いた丁寧語・サロンの品格" },
  { id: "story",    label: "ストーリー", emoji: "📖", desc: "体験談・ビフォーアフター・共感重視" },
  { id: "question", label: "問いかけ",   emoji: "💬", desc: "読者への語りかけ・肌悩みに寄り添う" },
  { id: "fact",     label: "データ重視", emoji: "📊", desc: "数字・効果・具体情報で信頼感" },
];

const STYLE_PROMPTS = {
  pop:      "明るくポップ。絵文字8〜12個。「〜ですよ！」「〜しちゃいましょう♪」などテンポよく。スクロールを止める勢い。",
  elegant:  "上品で落ち着いたトーン。絵文字3〜5個のみ。「〜でございます」「〜いただけます」などサロンらしい丁寧語。",
  story:    "体験談・ビフォーアフター形式から入る。「3ヶ月通い続けたお客様が...」「施術後、鏡を見て...」のように変化を具体的に描写。感情から入り情報は後から。",
  question: "読者の肌悩みへの問いかけから入る。「毛穴が気になって素肌を見せられない...」「毎日ムダ毛処理でお肌が荒れていませんか？」悩みに共鳴してから解決策として提示。",
  fact:     "冒頭から数字・データで引きつける。「光脱毛○回で毛量が約80%減」「フェイシャル後の肌水分量が平均○%アップ」など具体情報を先行させて信頼性を確立。",
};

const OPENING_BANK = [
  "ビフォーアフター・体験談から入る（「〇ヶ月通ったお客様が...」など）",
  "肌悩みへの問いかけから入る（「毛穴・ムダ毛・乾燥肌、気になっていませんか？」など）",
  "驚きの数字・データから入る（施術効果の具体的な数字）",
  "季節・肌コンディションの感覚から入る（「日焼けが気になる季節が来ました...」など）",
  "お客様の声・リアルな反応から入る（「先日来てくれたお客様が...」など）",
  "逆説・意外な切り口から入る（「実は、肌荒れしているときこそフェイシャルが効く理由」など）",
  "今の時期だけのタイミング感から入る（「夏の肌ダメージが出やすい今の時期に...」など）",
];

const PLATFORMS = [
  { id: "threads",   name: "Threads",                  sub: "コピー → Threadsで投稿",   url: "https://www.threads.net/",     iconChar: "◉", color: "#1a1a1a" },
  { id: "google",    name: "Google ビジネス",           sub: "コピー → 管理画面で投稿",  url: "https://business.google.com/", iconChar: "G",  color: "#4285F4" },
  { id: "hotpepper", name: "ホットペッパービューティー", sub: "コピー → HPB管理画面",     url: "https://salon.hotpepper.jp/",  iconChar: "H",  color: "#D42B2B" },
];

const EXAMPLES = [
  "全身脱毛サブスク月額5,980円〜。今月末まで入会金無料。",
  "夏前の集中ケアに！毛穴・くすみ・ニキビ跡をまとめて改善。",
  "VIO脱毛初回体験3,000円（通常8,000円）。7月末まで。",
  "13周年記念！全メニュー20%OFFキャンペーン開催中。",
];

// Primary and secondary colors for este version
const C = { primary: "#7B5EA7", light: "#F2EDF8", mid: "#5C4480", border: "#DDD5E8" };

function pickOpening() {
  return OPENING_BANK[Math.floor(Math.random() * OPENING_BANK.length)];
}

function buildAllPrompt(input, type, style) {
  const tLabel = TYPES.find(t => t.id === type)?.label || "";
  const styleDesc = STYLE_PROMPTS[style] || "";
  const opening = pickOpening();
  return `あなたは福井県福井市にある「Meshie（ミーシェ）」エステ・脱毛サロンのSNS担当者です。
Meshieは13年以上の歴史を持つ女性専用サロンで、脱毛（SHR光脱毛・VIO・全身）とフェイシャルエステ（肌質改善・毛穴・ニキビ跡）を提供しています。サブスクリプション型の料金プランが特徴。

━━ 必須ルール（破ると失敗とみなす）━━
・「こんにちは」「お知らせです」「みなさん」「Meshieです！」で始めない
・「美肌を目指す」「きれいになりたい」「コンプレックスを解消」を冒頭フレーズにしない
・前回と同じ絵文字の並び順にしない
・今回の出だしパターン：${opening}（必ずこの手法で書き始める）

━━ 今回のトーン・スタイル ━━
${styleDesc}

投稿タイプ: ${tLabel}
投稿内容: ${input}

JSONのみで返答（コードブロック・前置き・説明文一切不要）:
{
  "threads": "Threads用（スタイルに合った口調・絵文字・#脱毛 #フェイシャル #福井 #Meshie #ミーシェ #美肌 等ハッシュタグは最後の行にまとめる・400文字以内）",
  "google": "Googleビジネスプロフィール用（信頼感のある文体・13年の歴史・サービスと特徴を明確に・250文字以内）",
  "hotpepper": "ホットペッパービューティー用（施術名・効果・価格があれば記載・思わず予約したくなる内容・150文字前後）"
}`;
}

function buildSinglePrompt(input, type, style, platformId, prevText) {
  const tLabel = TYPES.find(t => t.id === type)?.label || "";
  const styleDesc = STYLE_PROMPTS[style] || "";
  const opening = pickOpening();
  const platformName = PLATFORMS.find(p => p.id === platformId)?.name || "";
  const specs = {
    threads:   "Threads用（絵文字あり・#脱毛 #フェイシャル #福井 #Meshie等ハッシュタグ付き・400文字以内）",
    google:    "Googleビジネスプロフィール用（信頼感ある文体・250文字以内）",
    hotpepper: "ホットペッパービューティー用（施術名・効果・価格を具体的に・150文字前後）",
  };
  return `Meshieエステ・脱毛サロン（福井市・13年以上の歴史）のSNS担当として、${platformName}向けの投稿文を書き直してください。

━━ 前回の文章（これと全然違う構成・表現にすること）━━
${prevText}

━━ 必須ルール ━━
・「こんにちは」「お知らせです」「みなさん」「Meshieです！」で始めない
・前回と同じ出だし・構成・絵文字パターンを使わない
・今回の出だしパターン：${opening}

今回のスタイル: ${styleDesc}
投稿タイプ: ${tLabel}
内容: ${input}

${specs[platformId] || ""}
JSONのみで返答（前置き不要）: {"${platformId}": "投稿文"}`;
}

function App() {
  const [tab, setTab] = useState("create");
  const [type, setType] = useState("campaign");
  const [style, setStyle] = useState("pop");
  const [input, setInput] = useState("");
  const [focusInput, setFocusInput] = useState(false);
  const [loading, setLoading] = useState(false);
  const [regenLoading, setRegenLoading] = useState({});
  const [result, setResult] = useState(null);
  const [err, setErr] = useState("");
  const [copied, setCopied] = useState({});
  const [history, setHistory] = useState([]);

  async function generate() {
    if (!input.trim() || loading) return;
    setLoading(true); setErr(""); setResult(null);
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1200, messages: [{ role: "user", content: buildAllPrompt(input, type, style) }] }),
      });
      const data = await res.json();
      const text = data.content.map(b => b.text || "").join("").replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(text);
      setResult(parsed);
      setHistory(p => [{ id: Date.now(), input, type, style, content: parsed, at: new Date().toLocaleString("ja-JP") }, ...p].slice(0, 8));
    } catch { setErr("生成に失敗しました。もう一度お試しください。"); }
    setLoading(false);
  }

  async function regenOne(platformId) {
    if (!input.trim() || regenLoading[platformId] || !result) return;
    setRegenLoading(p => ({ ...p, [platformId]: true }));
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 600, messages: [{ role: "user", content: buildSinglePrompt(input, type, style, platformId, result[platformId]) }] }),
      });
      const data = await res.json();
      const text = data.content.map(b => b.text || "").join("").replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(text);
      if (parsed[platformId]) setResult(prev => ({ ...prev, [platformId]: parsed[platformId] }));
    } catch {}
    setRegenLoading(p => ({ ...p, [platformId]: false }));
  }

  async function doCopy(key, text) {
    try {
      await navigator.clipboard.writeText(text);
      setCopied(p => ({ ...p, [key]: true }));
      setTimeout(() => setCopied(p => ({ ...p, [key]: false })), 2500);
    } catch {}
  }

  const F = "'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif";

  return (
    <div style={{ minHeight: "100vh", background: "#F7F4F8", fontFamily: F }}>
      {/* Header */}
      <div style={{ background: "#fff", borderBottom: `1px solid ${C.border}`, padding: "15px 24px", display: "flex", alignItems: "center", gap: 14 }}>
        <div style={{ width: 40, height: 40, borderRadius: 12, background: C.primary, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20, boxShadow: "0 2px 8px rgba(123,94,167,0.25)" }}>💎</div>
        <div>
          <div style={{ fontSize: 15, fontWeight: 700, color: "#1E1A14", letterSpacing: "0.02em" }}>Meshie SNS管理ツール</div>
          <div style={{ fontSize: 11, color: "#A09484" }}>エステ・脱毛サロン • 福井市 • 13年以上の歴史</div>
        </div>
        <div style={{ marginLeft: "auto", padding: "4px 12px", borderRadius: 20, background: C.light, color: C.primary, fontSize: 11, fontWeight: 700 }}>● AI生成</div>
      </div>

      {/* Tabs */}
      <div style={{ background: "#fff", borderBottom: `1px solid ${C.border}`, padding: "0 24px", display: "flex", gap: 28 }}>
        {[{ id: "create", label: "投稿を作成" }, { id: "history", label: `履歴 (${history.length})` }].map(t => (
          <button key={t.id} onClick={() => setTab(t.id)} style={{ padding: "12px 0", fontSize: 13, fontWeight: tab === t.id ? 700 : 400, color: tab === t.id ? C.primary : "#999", background: "none", border: "none", borderBottom: `2px solid ${tab === t.id ? C.primary : "transparent"}`, cursor: "pointer" }}>
            {t.label}
          </button>
        ))}
      </div>

      <div style={{ maxWidth: 740, margin: "0 auto", padding: "24px 20px" }}>

        {tab === "create" && (
          <>
            <div style={{ background: "#fff", borderRadius: 18, border: `1px solid ${C.border}`, padding: "22px 24px", marginBottom: 18 }}>
              {/* 投稿タイプ */}
              <div style={{ fontSize: 12, fontWeight: 700, color: "#A09484", letterSpacing: "0.1em", marginBottom: 10 }}>投稿タイプ</div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 8, marginBottom: 20 }}>
                {TYPES.map(t => (
                  <button key={t.id} onClick={() => setType(t.id)} style={{ padding: "10px 6px", borderRadius: 12, border: `2px solid ${type === t.id ? C.primary : C.border}`, background: type === t.id ? C.light : "#FAFAF8", cursor: "pointer", textAlign: "center" }}>
                    <div style={{ fontSize: 18, marginBottom: 4 }}>{t.emoji}</div>
                    <div style={{ fontSize: 12, fontWeight: type === t.id ? 700 : 500, color: type === t.id ? C.mid : "#4A4035" }}>{t.label}</div>
                    <div style={{ fontSize: 10, color: "#B0A898", marginTop: 2 }}>{t.sub}</div>
                  </button>
                ))}
              </div>

              {/* 投稿スタイル */}
              <div style={{ fontSize: 12, fontWeight: 700, color: "#A09484", letterSpacing: "0.1em", marginBottom: 10 }}>投稿スタイル</div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
                {STYLES.map(s => (
                  <button key={s.id} onClick={() => setStyle(s.id)} style={{ padding: "7px 14px", borderRadius: 20, border: `2px solid ${style === s.id ? C.primary : C.border}`, background: style === s.id ? C.light : "#FAFAF8", color: style === s.id ? C.mid : "#6B5F52", fontSize: 13, fontWeight: style === s.id ? 700 : 400, cursor: "pointer", display: "flex", alignItems: "center", gap: 5 }}>
                    <span>{s.emoji}</span> {s.label}
                  </button>
                ))}
              </div>
              <div style={{ fontSize: 12, color: "#9A9088", background: "#F5F3EE", borderRadius: 8, padding: "8px 12px", marginBottom: 18, lineHeight: 1.6 }}>
                💡 {STYLES.find(s => s.id === style)?.desc}
              </div>

              {/* テキストエリア */}
              <div style={{ fontSize: 12, fontWeight: 700, color: "#A09484", letterSpacing: "0.1em", marginBottom: 8 }}>投稿内容</div>
              <textarea
                value={input}
                onChange={e => setInput(e.target.value)}
                onFocus={() => setFocusInput(true)}
                onBlur={() => setFocusInput(false)}
                placeholder="お知らせ内容を入力（キャンペーン詳細・日程・金額・施術名など）"
                style={{ width: "100%", minHeight: 88, padding: "12px 14px", borderRadius: 12, border: `${focusInput ? `2px solid ${C.primary}` : `1.5px solid ${C.border}`}`, background: "#FAF9F6", fontSize: 14, color: "#1E1A14", resize: "vertical", outline: "none", boxSizing: "border-box", fontFamily: F, lineHeight: 1.7 }}
              />
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8, marginBottom: 16 }}>
                {EXAMPLES.map((ex, i) => (
                  <button key={i} onClick={() => setInput(ex)} title={ex} style={{ padding: "4px 11px", borderRadius: 20, border: `1px solid ${C.border}`, background: "#FAF9F6", fontSize: 11, color: "#6B5F52", cursor: "pointer", maxWidth: 200, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                    {ex.slice(0, 18)}…
                  </button>
                ))}
              </div>

              <button onClick={generate} disabled={loading || !input.trim()} style={{ width: "100%", padding: "14px", borderRadius: 12, border: "none", fontSize: 14, fontWeight: 700, letterSpacing: "0.03em", cursor: loading || !input.trim() ? "not-allowed" : "pointer", background: loading || !input.trim() ? "#C8C0D8" : C.primary, color: "#fff", boxShadow: loading || !input.trim() ? "none" : "0 4px 14px rgba(123,94,167,0.3)" }}>
                {loading ? "✦ AIが3媒体分を生成中..." : "✦ 3プラットフォーム分の投稿文を生成する"}
              </button>
              {err && <div style={{ marginTop: 12, padding: "11px 14px", borderRadius: 10, background: "#FEF2F2", border: "1px solid #FECACA", color: "#B91C1C", fontSize: 13 }}>{err}</div>}
            </div>

            {result && PLATFORMS.map(p => (
              <div key={p.id} style={{ background: "#fff", borderRadius: 18, border: `1px solid ${C.border}`, padding: "20px 22px", marginBottom: 16 }}>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <div style={{ width: 34, height: 34, borderRadius: 10, background: p.color, display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontSize: 14, fontWeight: 700, flexShrink: 0 }}>{p.iconChar}</div>
                    <div>
                      <div style={{ fontSize: 13, fontWeight: 700, color: "#1E1A14" }}>{p.name}</div>
                      <div style={{ fontSize: 11, color: "#B0A898" }}>💡 {p.sub}</div>
                    </div>
                  </div>
                  <div style={{ display: "flex", gap: 7, flexShrink: 0 }}>
                    <button onClick={() => regenOne(p.id)} disabled={regenLoading[p.id]} style={{ padding: "6px 12px", borderRadius: 8, border: `1.5px solid ${C.border}`, background: "#FAFAF8", color: "#6B5F52", fontSize: 12, fontWeight: 600, cursor: regenLoading[p.id] ? "wait" : "pointer" }}>
                      {regenLoading[p.id] ? "..." : "↺ 別パターン"}
                    </button>
                    <button onClick={() => doCopy(p.id, result[p.id])} style={{ padding: "6px 14px", borderRadius: 8, border: `1.5px solid ${copied[p.id] ? C.primary : C.border}`, background: copied[p.id] ? C.light : "#FAFAF8", color: copied[p.id] ? C.mid : "#6B5F52", fontSize: 12, fontWeight: copied[p.id] ? 700 : 400, cursor: "pointer" }}>
                      {copied[p.id] ? "✓ コピー完了!" : "コピー"}
                    </button>
                    <a href={p.url} target="_blank" rel="noopener noreferrer" style={{ padding: "6px 14px", borderRadius: 8, background: "#1E1A14", color: "#fff", fontSize: 12, fontWeight: 600, textDecoration: "none", display: "inline-block" }}>
                      管理画面 →
                    </a>
                  </div>
                </div>
                <div style={{ background: "#FAFAF8", borderRadius: 12, padding: "14px 16px", fontSize: 14, color: "#2A2018", lineHeight: 1.85, whiteSpace: "pre-wrap", border: `1px solid ${C.border}`, minHeight: 60 }}>
                  {regenLoading[p.id] ? <span style={{ color: "#B0A898" }}>別パターンを生成中...</span> : result[p.id]}
                </div>
                <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 7, fontSize: 11, color: "#C0B8B0" }}>{result[p.id]?.length || 0}文字</div>
              </div>
            ))}
          </>
        )}

        {tab === "history" && (
          <>
            {history.length === 0 ? (
              <div style={{ textAlign: "center", padding: "64px 0", color: "#C0B8B0" }}>
                <div style={{ fontSize: 40, marginBottom: 12 }}>📋</div>
                <div style={{ fontSize: 14 }}>まだ生成履歴がありません</div>
              </div>
            ) : history.map(h => (
              <div key={h.id} style={{ background: "#fff", borderRadius: 16, border: `1px solid ${C.border}`, padding: "18px 22px", marginBottom: 14 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                  <div style={{ fontSize: 11, color: "#B0A898" }}>{h.at}</div>
                  <div style={{ display: "flex", gap: 6 }}>
                    <span style={{ fontSize: 11, background: C.light, color: C.mid, padding: "2px 9px", borderRadius: 5, fontWeight: 600 }}>{TYPES.find(t => t.id === h.type)?.emoji} {TYPES.find(t => t.id === h.type)?.label}</span>
                    <span style={{ fontSize: 11, background: "#F5F3EE", color: "#6B5F52", padding: "2px 9px", borderRadius: 5 }}>{STYLES.find(s => s.id === h.style)?.emoji} {STYLES.find(s => s.id === h.style)?.label}</span>
                  </div>
                </div>
                <div style={{ fontSize: 14, color: "#2A2018", lineHeight: 1.7, marginBottom: 12, fontWeight: 500 }}>{h.input}</div>
                <button onClick={() => { setResult(h.content); setInput(h.input); setType(h.type); setStyle(h.style); setTab("create"); }} style={{ padding: "6px 14px", borderRadius: 8, border: `1.5px solid ${C.border}`, background: C.light, color: C.mid, fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                  この内容を再利用 →
                </button>
              </div>
            ))}
          </>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
